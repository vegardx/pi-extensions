name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No write access needed; default GITHUB_TOKEN is fine.
permissions:
  contents: read

# Cancel older runs on the same PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    container: node:22-slim
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install make and git
        run: apt-get update -qq && apt-get install -y --no-install-recommends make git
      - name: Install dependencies
        run: npm ci
      - name: make check
        run: make check
