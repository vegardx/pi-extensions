name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No write access needed; default GITHUB_TOKEN is fine.
permissions:
  contents: read

# Cancel older runs on the same PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: make check
        run: make check
