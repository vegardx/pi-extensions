name: Rebase PRs

# Runs whenever main moves forward, and can be triggered manually.
# Finds open PRs that are BEHIND main and rebases them, which
# re-triggers CI so auto-merge can fire once checks go green.
#
# Requires a PAT stored as secrets.AUTOMATION_TOKEN with fine-grained
# permissions: Contents (read/write) + Pull requests (read-only).
# GITHUB_TOKEN cannot be used here — GitHub suppresses workflow
# triggers from GITHUB_TOKEN-authenticated pushes, so CI would never
# fire on the rebased branches.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rebase-prs
  cancel-in-progress: true

jobs:
  update:
    name: Rebase behind PRs on main
    runs-on: ubuntu-latest
    steps:
      - name: Rebase behind PRs
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          behind=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --state open \
            --json number,mergeStateStatus,isDraft \
            --jq '[.[] | select(.mergeStateStatus == "BEHIND" and .isDraft == false) | .number] | .[]')

          if [ -z "$behind" ]; then
            echo "All open PRs are up to date."
            exit 0
          fi

          for n in $behind; do
            echo "Rebasing PR #$n on main..."
            gh pr update-branch "$n" \
              --repo "$GITHUB_REPOSITORY" \
              --rebase \
              && echo "PR #$n rebased." \
              || echo "PR #$n: rebase failed (conflict?), skipping."
          done
